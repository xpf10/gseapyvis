[project]
name = "gseapyvis"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "xpf10", email = "hilbet@outlook.com" }
]
requires-python = ">=3.10"

dependencies = [
    "gseapy>=1.1.9,<2.0.0",
    "joblib>=1.5.1,<2.0.0",
    "jupyter>=1.1.1,<2.0.0",
    "notebook>=7.4.4,<8.0.0",
    "rich>=14.0.0,<15.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "typer>=0.16.0,<1.0.0",
    "lets-plot>=4.0.0",
]

[project.scripts]
gseapyvis = "gseapyvis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
